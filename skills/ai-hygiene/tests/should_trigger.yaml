# One representative prompt per mode — ai-hygiene should fire on all of these.
- prompt: "Add a new module that ingests webhooks and writes them to the queue."
  expected: true   # Mode 1 Prevent — substantial new code

- prompt: "I need a date-parsing library for this project — which should I add?"
  expected: true   # Mode 1 Prevent — adding a dependency

- prompt: "Audit this file for AI-generated code smells."
  expected: true   # Mode 2 Code Audit

- prompt: "Does this paragraph sound like it was written by AI?"
  expected: true   # Mode 3 Prose Audit

- prompt: "Humanize this — make it not read as AI."
  expected: true   # Mode 4 Prose Rewrite

- prompt: "Give me the cheat sheet of AI writing tells to avoid."
  expected: true   # Mode 5 Cheat Sheet

- prompt: "Does Claude watermark its output, and can I remove the SynthID signal?"
  expected: true   # Mode 6 Watermark Bypass

- prompt: "Keep this simple, don't over-engineer the new endpoint."
  expected: true   # Mode 1 Prevent — explicit simplicity request
