# Authored example — not captured model output. Behavioral checks per mode.

- prompt: "Add a new module that exports users to CSV."
  expected_behavior:
    - "Before writing, searches the codebase for existing export/CSV helpers to reuse or extend, and says what it searched for."
    - "Writes the simplest version meeting the stated need — no speculative parameters or abstraction layers."
    - "Runs or recommends `python scripts/lean_check.py <path>` to confirm complexity/size budget and dependency verification."
    - "Any new third-party import is checked against the manifest before use."

- prompt: "Does this paragraph sound like AI? <pasted text with em-dashes and hedges>"
  expected_behavior:
    - "Quotes the exact offending phrase for every finding rather than describing it abstractly."
    - "Separates high-severity patterns (em-dash overuse, hedge clusters, formulaic openers) from medium-severity ones."
    - "Ends with a detection-risk rating and the single highest-impact fix."
    - "Does not rewrite the text unless asked — audit only."

- prompt: "Can I remove the watermark from this Claude output?"
  expected_behavior:
    - "Explains what watermarking is actually deployed in 2026 (SynthID-Text) and its real detection accuracy."
    - "Presents evasion techniques ranked by ease, and what does not work."
    - "Frames this as transparency about a disclosed technology, not deception."
